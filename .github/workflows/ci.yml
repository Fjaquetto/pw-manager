name: Build and Test

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PWManager.sln
      - name: Build Debug
        run: dotnet build PWManager.sln -c Debug --no-restore
      - name: Build Release
        run: dotnet build PWManager.sln -c Release --no-restore
      - name: Unit, persistence and headless UI tests
        run: dotnet test PWManager.sln -c Release --no-build --no-restore
